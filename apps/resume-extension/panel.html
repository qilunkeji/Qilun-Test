<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>齐论简历收集助手</title><link rel="stylesheet" href="panel.css"></head><body>
<header><b>齐论 AI</b><h1>简历收集助手</h1><p>人工收集 · 确认入库 · 岗位审阅</p></header>
<main><section><h2>连接本地验收系统</h2><p>插件ID：<code id="extension-id"></code></p><label>人才系统地址<input id="base" value="http://127.0.0.1:3101" type="url" required></label><p>登录该地址，在“简历库 → 插件授权”登记上方ID，生成一小时临时导入凭证。</p><label>插件专用临时授权<input id="token" type="password" autocomplete="off" placeholder="cr_…（不是智能体写权限凭证）"></label><button id="connect">授权此地址并连接</button><button id="disconnect">清除插件授权</button></section>
<section><h2>收集当前简历</h2><p class="hint">尚未确认BOSS页面读取许可，因此此版不抓取页面。请自行复制获准处理的简历文本，或选择获准下载的UTF-8 TXT。PDF/DOCX请先转为文本并核对。</p>
<form id="resume-form"><label>姓名 / 昵称<input name="name" required maxlength="200"></label><label>来源渠道<input name="channel" value="boss_manual" required maxlength="100"></label><label>来源稳定标识<input name="external_id" required maxlength="200" placeholder="使用可核验的候选人编号，不要填姓名"></label><p>同一来源更新请保持编号；无法核实编号时用新记录，不猜测同一人。</p><button type="button" id="new-id">为新记录生成独立编号</button><label>处理用途<select name="purpose"><option value="recruitment">当前招聘</option><option value="talent_pool">已获准长期储备</option></select></label><label>保留截止日期<input name="retention_until" type="date" required></label><label>处理依据与适用范围<textarea name="processing_basis" required maxlength="2000"></textarea></label><label>授权记录 / 取得依据<textarea name="authorization_ref" required maxlength="1000"></textarea></label><label>材料完整度<select name="completeness"><option value="full">完整材料</option><option value="summary_only">仅摘要</option></select></label><label>获准下载的TXT<input id="file" type="file" accept=".txt,text/plain"></label><label>简历原文<textarea id="text" name="text_content" required maxlength="200000" rows="12"></textarea></label><label class="consent"><input id="consent" type="checkbox" required>我已核验本材料有权处理，且收集方式符合来源平台许可及当前用途。</label><button type="submit" class="primary">收集当前简历</button></form></section>
<section id="preview" hidden><h2>确认导入预览</h2><pre id="preview-text"></pre><button id="import" class="primary">确认导入齐论简历库</button><button id="cancel">取消 / 继续编辑</button></section><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="panel.js"></script></body></html>
