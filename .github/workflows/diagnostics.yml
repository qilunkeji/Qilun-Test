name: Production Read-only Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 124.223.159.190 >> ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName 124.223.159.190\n  User root\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h-%%p\n  ControlPersist 10m\n' >> ~/.ssh/config
      - name: Regression test (harmless temp state)
        run: |
          ssh deploy-target 'bash -s' << 'OUTER'
          echo "=== container state ==="
          docker inspect qilun-talent-java --format 'image={{.Config.Image}} started={{.State.StartedAt}}'
          docker exec qilun-talent-java sha256sum /app/app.jar | cut -c1-16
          echo "=== IAM callback regression: login -> callback(bogus code) ==="
          curl -s -o /dev/null "https://rc.iqilun.cn/api/iam/login?returnTo=%2F"
          STATE_DB=$(docker exec qilun-pg16 psql -U qilun -d qilun_talent -t -A -c "SELECT payload->>'state' FROM iam_states ORDER BY expires DESC LIMIT 1")
          echo "state head: ${STATE_DB:0:6}..."
          curl -s -o /tmp/cb.json -w "callback -> %{http_code}\n" "https://rc.iqilun.cn/api/iam/callback?code=bogus_test_code&state=$STATE_DB"
          head -c 250 /tmp/cb.json; echo
          echo "--- any new INTERNAL_ERROR? ---"
          docker logs qilun-talent-java --since 3m 2>&1 | grep -c "INTERNAL_ERROR" || true
          echo "DIAG_DONE"
          OUTER
