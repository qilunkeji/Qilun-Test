name: Production Read-only Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 124.223.159.190 >> ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName 124.223.159.190\n  User root\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h-%%p\n  ControlPersist 10m\n' >> ~/.ssh/config
      - name: Inventory all hosted sites (read-only)
        run: |
          ssh deploy-target 'bash -s' << 'OUTER'
          echo "=== 1. all sites in 1panel ==="
          ls /opt/1panel/www/sites/ 2>/dev/null
          echo "=== 2. count by TLD ==="
          ls /opt/1panel/www/sites/ 2>/dev/null | awk -F. '{print $(NF)}' | sort | uniq -c | sort -rn
          echo "=== 3. .icu domains: what does each serve? ==="
          for f in /opt/1panel/www/conf.d/*.icu.conf /opt/1panel/www/conf.d/*.conf; do
            [ -f "$f" ] || continue
            SN=$(grep -m1 "server_name" "$f" | sed 's/;//')
            PP=$(grep -m1 "proxy_pass" "$f" | tr -d ' ;')
            RT=$(grep -m1 "root " "$f" | tr -d ' ;')
            echo "$(basename $f) | $SN | ${PP}${RT}"
          done | sort -u | head -45
          echo "=== 4. certs issued for icu domains ==="
          ls /opt/1panel/www/sites/*/ssl/fullchain.pem 2>/dev/null | awk -F/ '{print $6}' | sort | head -35
          echo "DIAG_DONE"
          OUTER
