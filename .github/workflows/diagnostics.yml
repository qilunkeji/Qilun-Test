name: Production Read-only Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 124.223.159.190 >> ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName 124.223.159.190\n  User root\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h-%%p\n  ControlPersist 10m\n' >> ~/.ssh/config
      - name: Read-only diagnostics (SELECT + find only)
        run: |
          ssh deploy-target << 'EOF'
          set -e
          PSQL="docker exec qilun-pg16 psql -U qilun -d qilun_talent -P pager=off"
          echo "=== server time (for interpreting timestamps) ==="
          date; docker exec qilun-pg16 psql -U qilun -d qilun_talent -P pager=off -c "SELECT now();"
          echo "=== A. tenants ==="
          $PSQL -c "SELECT id, name, created_at FROM tenants ORDER BY created_at;"
          echo "=== B. staff users and IAM mapping ==="
          $PSQL -c "SELECT u.tenant_id, u.username, u.role, i.subject AS iam_subject FROM staff_users u LEFT JOIN iam_identities i ON i.tenant_id=u.tenant_id AND i.user_id=u.id;"
          echo "=== O. nginx access log: invites & auth traffic (last 7d) ==="
          docker exec 1Panel-openresty-6AKl sh -c "grep -h 'assessment/invites' /var/log/nginx/rc.iqilun.cn.access.log* 2>/dev/null | tail -30" || true
          echo "--- status code summary for invites ---"
          docker exec 1Panel-openresty-6AKl sh -c "grep -h 'assessment/invites' /var/log/nginx/rc.iqilun.cn.access.log* 2>/dev/null | grep -oE ' (200|301|302|304|400|401|403|404|500|502|503) ' | sort | uniq -c" || true
          echo "--- iam callback/login trail (last 40) ---"
          docker exec 1Panel-openresty-6AKl sh -c "grep -hE 'iam/(login|callback)' /var/log/nginx/rc.iqilun.cn.access.log* 2>/dev/null | tail -40" || true
          echo "--- browser UA requests today (non-curl), first 40 ---"
          docker exec 1Panel-openresty-6AKl sh -c "grep -h '14/Oct/2026\|13/Oct/2026' /var/log/nginx/rc.iqilun.cn.access.log 2>/dev/null | grep -vE 'curl|Chrome-Lighthouse' | tail -40" || true
          echo "DIAG_DONE"
          EOF
