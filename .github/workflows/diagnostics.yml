name: Production Read-only Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 124.223.159.190 >> ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName 124.223.159.190\n  User root\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h-%%p\n  ControlPersist 10m\n' >> ~/.ssh/config
      - name: Extract operator CSS from backup (read-only)
        run: |
          ssh deploy-target 'bash -s' << 'OUTER'
          for B in /opt/qilun-talent/backups/frontend-before-vue-restore-20261014-173049.tgz /opt/qilun-talent/backups/frontend-before-vue-restore-20261014-171730.tgz; do
            echo "=== $B ==="
            tar -tzf "$B" | grep -vE "index-[A-Za-z0-9_-]+|[A-Za-z]+View-|components-|logic-" | head -20
            echo "--- index.html links ---"
            tar -xzOf "$B" ./index.html 2>/dev/null | grep -oE '(href|src)="[^"]*"' | head -8
          done
          echo "--- live dir right now: any non-hashed files? ---"
          ls /opt/1panel/www/sites/rc.iqilun.cn/frontend-access-20261013/assets/ | grep -vE "^[A-Za-z]+-[A-Za-z0-9_-]+\.(js|css)$|^[a-z]+\.(png|jpg|svg|woff2?)$" | head -10
          echo "DIAG_DONE"
          OUTER
