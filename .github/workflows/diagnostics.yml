name: Production Read-only Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 124.223.159.190 >> ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName 124.223.159.190\n  User root\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h-%%p\n  ControlPersist 10m\n' >> ~/.ssh/config
      - name: Extract operator CSS from backup (read-only)
        run: |
          ssh deploy-target 'bash -s' << 'OUTER'
          B=/opt/qilun-talent/backups/frontend-before-vue-restore-20261014-171730.tgz
          echo "=== backup contains ==="
          tar -tzf "$B" | grep -E "restored|index" | head -5
          echo "=== their index.html (stylesheet links) ==="
          tar -xzOf "$B" index.html 2>/dev/null | grep -oE '<link[^>]*>|<script[^>]*>' | head -6
          echo "=== their CSS full content ==="
          tar -xzOf "$B" assets/assessment-restored20261014.css 2>/dev/null | head -c 3000
          echo
          echo "DIAG_DONE"
          OUTER
