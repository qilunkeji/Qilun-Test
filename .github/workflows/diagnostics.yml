name: Production Read-only Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 124.223.159.190 >> ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName 124.223.159.190\n  User root\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h-%%p\n  ControlPersist 10m\n' >> ~/.ssh/config
      - name: Read-only diagnostics (SELECT + find only)
        run: |
          ssh deploy-target << 'EOF'
          set -e
          PSQL="docker exec qilun-pg16 psql -U qilun -d qilun_talent -P pager=off"
          echo "=== server time (for interpreting timestamps) ==="
          date; docker exec qilun-pg16 psql -U qilun -d qilun_talent -P pager=off -c "SELECT now();"
          echo "=== A. tenants ==="
          $PSQL -c "SELECT id, name, created_at FROM tenants ORDER BY created_at;"
          echo "=== B. staff users and IAM mapping ==="
          $PSQL -c "SELECT u.tenant_id, u.username, u.role, i.subject AS iam_subject FROM staff_users u LEFT JOIN iam_identities i ON i.tenant_id=u.tenant_id AND i.user_id=u.id;"
          echo "=== C. active sessions per tenant ==="
          $PSQL -c "SELECT tenant_id, count(*) AS active_sessions, max(created_at) AS latest FROM sessions WHERE expires_at>now() GROUP BY 1 ORDER BY 2 DESC;"
          echo "=== D. runtime tenant config (non-secret) ==="
          docker inspect qilun-talent-java --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E "^(DEFAULT_TENANT_ID|IAM_SYSTEM_ID|QILUN_DATABASE_URL|PROCESSING_MODE)" | sed -E 's#(jdbc:postgresql://[^/]*/)[^?]*#\1<db>#'
          echo "=== E. recent business audit actor (who is logging in) ==="
          $PSQL -c "SELECT actor_id, action, count(*) n, max(created_at) last FROM audit_events WHERE created_at>now()-interval '2 days' GROUP BY 1,2 ORDER BY 4 DESC LIMIT 15;"
          echo "DIAG_DONE"
          EOF
