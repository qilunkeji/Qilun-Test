name: Production Read-only Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 124.223.159.190 >> ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName 124.223.159.190\n  User root\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h-%%p\n  ControlPersist 10m\n' >> ~/.ssh/config
      - name: Logs (read-only)
        run: |
          ssh deploy-target 'bash -s' << 'OUTER'
          echo "=== 1. INTERNAL_ERROR stack traces (last 2) ==="
          docker logs qilun-talent-java --since 6h 2>&1 | grep -n "INTERNAL_ERROR" | tail -5
          echo "--- full stack around last occurrence ---"
          docker logs qilun-talent-java --since 6h 2>&1 | awk '/INTERNAL_ERROR/{found=NR} END{print found}' > /tmp/lastline
          L=$(cat /tmp/lastline)
          echo "stack starts at line $L"
          docker logs qilun-talent-java --since 6h 2>&1 | sed -n "$((L-2)),$((L+60))p"
          echo "=== 2. request_id match ==="
          docker logs qilun-talent-java --since 6h 2>&1 | grep -c "98084195-44d3-4bb3-9236-e60e2f024379" || true
          echo "=== 3. IAM center health ==="
          curl -s -o /dev/null -w "issuer root: %{http_code}\n" https://zh.iqilun.cn/
          docker logs qilun-iam --since 6h 2>&1 | grep -viE "healthcheck|GET /healthz" | tail -15
          echo "DIAG_DONE"
          OUTER
