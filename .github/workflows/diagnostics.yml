name: Production Read-only Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostics.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 124.223.159.190 >> ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName 124.223.159.190\n  User root\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h-%%p\n  ControlPersist 10m\n' >> ~/.ssh/config
      - name: Read-only diagnostics (SELECT + find only)
        run: |
          ssh deploy-target << 'EOF'
          set -e
          PSQL="docker exec qilun-pg16 psql -U qilun -d qilun_talent -P pager=off"
          echo "=== server time (for interpreting timestamps) ==="
          date; docker exec qilun-pg16 psql -U qilun -d qilun_talent -P pager=off -c "SELECT now();"
          echo "=== A. tenants ==="
          $PSQL -c "SELECT id, name, created_at FROM tenants ORDER BY created_at;"
          echo "=== B. staff users and IAM mapping ==="
          $PSQL -c "SELECT u.tenant_id, u.username, u.role, i.subject AS iam_subject FROM staff_users u LEFT JOIN iam_identities i ON i.tenant_id=u.tenant_id AND i.user_id=u.id;"
          echo "=== H. authenticated request test (temp session, auto-cleaned) ==="
          TOKEN=diag_$(openssl rand -hex 24)
          HASH=$(printf %s "$TOKEN" | sha256sum | cut -d' ' -f1)
          $PSQL -c "INSERT INTO sessions SELECT '$HASH', u.tenant_id, u.id, 'diag-csrf', now()+interval '20 minutes' FROM staff_users u WHERE u.username='talent-admin';"
          echo "--- GET /assessment/invites?view=reports ---"
          curl -s -o /tmp/r1.json -w "HTTP %{http_code} size=%{size_download}
" -H "Origin: https://rc.iqilun.cn" -H "Cookie: qilun_session=$TOKEN" "http://127.0.0.1:43130/api/v1/assessment/invites?view=reports"
          head -c 1200 /tmp/r1.json; echo
          echo "--- GET /assessment/invites (no view) ---"
          curl -s -o /tmp/r2.json -w "HTTP %{http_code} size=%{size_download}
" -H "Origin: https://rc.iqilun.cn" -H "Cookie: qilun_session=$TOKEN" "http://127.0.0.1:43130/api/v1/assessment/invites"
          python3 -c "import json;d=json.load(open('/tmp/r2.json'));print('no-view total=',d.get('data',{}).get('total'))" 2>/dev/null || head -c 400 /tmp/r2.json
          echo
          echo "--- GET /dashboard ---"
          curl -s -o /tmp/r3.json -w "HTTP %{http_code}
" -H "Origin: https://rc.iqilun.cn" -H "Cookie: qilun_session=$TOKEN" "http://127.0.0.1:43130/api/v1/dashboard"
          head -c 300 /tmp/r3.json; echo
          $PSQL -c "DELETE FROM sessions WHERE token_hash='$HASH';"
          echo "(temp session removed)"
          echo "DIAG_DONE"
          EOF
