name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qilun
          POSTGRES_PASSWORD: qilun
          POSTGRES_DB: qilun_maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qilun -d qilun_maintenance"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGURL: postgres://qilun:qilun@127.0.0.1:5432/qilun_maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Tests (embedded PGlite)
        run: pnpm test
      - name: Tests (PostgreSQL 16)
        run: pnpm test
        env:
          DATABASE_URL: ${{ env.PGURL }}
      - name: Production build
        run: pnpm run build
      - name: Fixed scoring rules verification
        run: node --experimental-strip-types deploy/verify-qilun-standard.mjs
      - name: Golden vectors deterministic regeneration check
        run: node --experimental-strip-types tools/golden/generate.mjs --check
      - name: API parity differ self-check
        run: node --experimental-strip-types tools/parity/differ.mjs

  crosstest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Cross-language crypto regression (TS <-> Java)
        run: node --experimental-strip-types tools/crosstest/run.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qilun
          POSTGRES_PASSWORD: qilun
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qilun"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test (migration parity + crypto)
        working-directory: backend
        run: mvn -B package
        env:
          QILUN_TEST_PG: jdbc:postgresql://127.0.0.1:5432/postgres?user=qilun&password=qilun
