name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVER: 124.223.159.190
  REMOTE_DIR: /opt/qilun-talent/shared

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qilun
          POSTGRES_PASSWORD: qilun
          POSTGRES_DB: qilun_maintenance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qilun"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Tests (PGlite)
        run: pnpm test
      - name: Tests (PostgreSQL)
        run: pnpm test
        env:
          DATABASE_URL: postgres://qilun:qilun@127.0.0.1:5432/qilun_maintenance
      - name: Backend build
        run: cd backend && mvn -B package -DskipTests
      - name: Frontend build
        run: cd frontend && pnpm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: Build artifacts
        run: |
          pnpm install --frozen-lockfile
          cd backend && mvn -B package -DskipTests && cd ..
          cd frontend && pnpm run build && cd ..
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SERVER }} >> ~/.ssh/known_hosts
          # One multiplexed connection: the runner→server link is slow (~25min per
          # fresh handshake/transfer), so every ssh/scp below must reuse it.
          printf 'Host deploy-target\n  HostName %s\n  User root\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h-%%p\n  ControlPersist 30m\n' "${{ env.SERVER }}" >> ~/.ssh/config
      - name: Upload artifacts
        run: |
          ssh deploy-target "mkdir -p ${{ env.REMOTE_DIR }}/frontend-dist ${{ env.REMOTE_DIR }}/engine-data-new"
          LOCAL_JAR_SHA=$(sha256sum backend/qilun-api/target/qilun-api-0.1.0-SNAPSHOT.jar | cut -d' ' -f1)
          REMOTE_JAR_SHA=$(ssh deploy-target "sha256sum ${{ env.REMOTE_DIR }}/app.jar 2>/dev/null | cut -d' ' -f1" || true)
          if [ "$LOCAL_JAR_SHA" != "$REMOTE_JAR_SHA" ]; then
            echo "jar changed ($LOCAL_JAR_SHA != $REMOTE_JAR_SHA) — uploading"
            scp backend/qilun-api/target/qilun-api-0.1.0-SNAPSHOT.jar deploy-target:${{ env.REMOTE_DIR }}/app.jar
          else
            echo "jar unchanged — skipping 39MB upload"
          fi
          tar czf /tmp/frontend.tgz -C frontend/dist .
          scp /tmp/frontend.tgz deploy-target:${{ env.REMOTE_DIR }}/frontend.tgz
          ssh deploy-target "rm -rf ${{ env.REMOTE_DIR }}/frontend-dist && mkdir -p ${{ env.REMOTE_DIR }}/frontend-dist && tar xzf ${{ env.REMOTE_DIR }}/frontend.tgz -C ${{ env.REMOTE_DIR }}/frontend-dist"
          tar czf /tmp/engine-data.tgz -C packages/assessment-engine/data .
          scp /tmp/engine-data.tgz deploy-target:${{ env.REMOTE_DIR }}/engine.tgz
          ssh deploy-target "rm -rf ${{ env.REMOTE_DIR }}/engine-data-new && mkdir -p ${{ env.REMOTE_DIR }}/engine-data-new && tar xzf ${{ env.REMOTE_DIR }}/engine.tgz -C ${{ env.REMOTE_DIR }}/engine-data-new"
      - name: Rebuild image & restart
        run: |
          ssh deploy-target << 'EOF'
          set -e
          cd /opt/qilun-talent/shared
          # Update build context
          rm -rf build-context
          mkdir -p build-context/packages/assessment-engine build-context/infra/migrations build-context/dist/admin-web
          cp app.jar build-context/
          cp -r engine-data-new/* build-context/packages/assessment-engine/data/ 2>/dev/null || (mkdir -p build-context/packages/assessment-engine/data && cp -r engine-data-new/* build-context/packages/assessment-engine/data/)
          cp -r migrations/* build-context/infra/migrations/ 2>/dev/null || true
          cp -r frontend-dist/* build-context/dist/admin-web/
          cp Dockerfile build-context/
          # Build
          cd build-context
          docker build -t qilun/java-api:latest -f Dockerfile .
          # Restart API only
          cd /opt/qilun-talent/shared
          export $(grep -E '^(CONTACT_ENCRYPTION_KEY|DEFAULT_TENANT_ID|IAM_CLIENT_ID|IAM_CLIENT_SECRET|IAM_WEBHOOK_SECRET|IAM_SYSTEM_ID|AGENT_WRITE_TOKEN_SHA256)=' production.env | xargs)
          export PG_PASSWORD=qilun_pg_2026
          docker compose -f docker-compose.yml up -d --no-deps api
          sleep 10
          # Health check
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://rc.iqilun.cn' http://127.0.0.1:43130/api/v1/health)
          if [ "$HEALTH" != "200" ]; then
            echo "DEPLOY FAILED: health=$HEALTH"
            docker logs qilun-talent-java --tail 20
            exit 1
          fi
          echo "DEPLOY OK: health=200"
          EOF
      - name: Publish frontend to live static root
        run: |
          ssh deploy-target << 'EOF'
          set -e
          # 1Panel openresty serves the SPA from the site's frontend-access dir
          # (mtime-matched to the served Last-Modified on 2026-10-13).
          LIVE=/opt/1panel/www/sites/rc.iqilun.cn/frontend-access-20261013
          test -f "$LIVE/index.html"
          test -d "$LIVE/assets"
          echo "LIVE static root: $LIVE"
          echo "--- site conf references (record) ---"
          grep -rn "frontend-access-20261013" /opt/1panel/apps/openresty/openresty/conf/ 2>/dev/null | head -5 || true
          ts=$(date +%Y%m%d-%H%M%S)
          mkdir -p /opt/qilun-talent/backups
          tar czf "/opt/qilun-talent/backups/frontend-before-vue-restore-$ts.tgz" -C "$LIVE" .
          SRC=/opt/qilun-talent/shared/frontend-dist
          test -f "$SRC/index.html"
          rm -rf "$LIVE/assets" "$LIVE/brand" "$LIVE/report-layout"
          cp -r "$SRC/assets" "$LIVE/assets"
          if [ -d "$SRC/brand" ]; then cp -r "$SRC/brand" "$LIVE/brand"; fi
          if [ -d "$SRC/report-layout" ]; then cp -r "$SRC/report-layout" "$LIVE/report-layout"; fi
          install -m 644 "$SRC/index.html" "$LIVE/.index.new.html"
          mv -f "$LIVE/.index.new.html" "$LIVE/index.html"
          echo "FRONTEND PUBLISHED: $LIVE (backup frontend-before-vue-restore-$ts.tgz)"
          sha256sum "$LIVE/index.html" "$SRC/index.html"
          EOF
      - name: Verify deployment
        run: |
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' https://rc.iqilun.cn/api/v1/health)
          echo "Public health check: $HEALTH"
          if [ "$HEALTH" != "200" ]; then
            echo "WARNING: public health=$HEALTH (may need time)"
          fi
          curl -s https://rc.iqilun.cn/index.html -o /tmp/live-index.html
          if ! cmp -s /tmp/live-index.html frontend/dist/index.html; then
            echo "ERROR: live index.html does not match the build"
            diff <(cat /tmp/live-index.html) frontend/dist/index.html || true
            exit 1
          fi
          echo "Live index.html matches this build exactly."
