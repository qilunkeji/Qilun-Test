server {
    listen 80;
    listen [::]:80;
    server_name rc.iqilun.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/rc.iqilun.cn/acme;
        default_type text/plain;
    }
    location / { return 308 https://rc.iqilun.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rc.iqilun.cn;
    ssl_certificate /www/sites/rc.iqilun.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/rc.iqilun.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /var/log/nginx/rc.iqilun.cn.access.log;
    error_log /var/log/nginx/rc.iqilun.cn.error.log;
    location ~ ^/(\.env|\.local|\.git|资料|migration)(/|$) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:43130;
        proxy_http_version 1.1;
        proxy_set_header Host rc.iqilun.cn;
        proxy_set_header X-Forwarded-Host rc.iqilun.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
        proxy_hide_header X-Powered-By;
    }
}
